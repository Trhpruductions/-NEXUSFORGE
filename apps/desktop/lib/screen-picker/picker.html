<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'self'; script-src 'self'" />
    <title>Share your screen</title>
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <header>
      <h1>Share your screen</h1>
      <p>Choose what the people in your voice channel will see.</p>
    </header>
    <main>
      <section aria-labelledby="screens-title">
        <h2 id="screens-title">Screens</h2>
        <div class="grid" id="screens"></div>
      </section>
      <section aria-labelledby="windows-title">
        <h2 id="windows-title">Windows</h2>
        <div class="grid" id="windows"></div>
        <p class="empty" id="windows-empty" hidden>No windows to share right now.</p>
      </section>
    </main>
    <footer>
      <p class="note">Sound from your computer is not shared. Your microphone keeps working while you share.</p>
      <div class="actions">
        <button type="button" id="cancel">Cancel</button>
        <button type="button" id="share" class="primary" disabled>Share</button>
      </div>
    </footer>
    <script src="picker.js"></script>
  </body>
</html>
