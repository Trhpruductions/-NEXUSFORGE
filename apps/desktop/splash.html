<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Forge Gaming</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #04060c;
        --panel: rgba(8, 12, 22, 0.82);
        --text: #e8f0ff;
        --muted: #94a8c6;
        --line: rgba(148, 163, 184, 0.18);
        --accent: #2ea4ff;
        --accent-2: #00f2ff;
        --violet: #a855f7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      /* The splash can be dragged to move the window; its buttons cannot. */
      body {
        margin: 0;
        display: grid;
        place-items: center;
        font-family: "Segoe UI Variable", "Bahnschrift", "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
        overflow: hidden;
        -webkit-app-region: drag;
        -webkit-user-select: none;
        user-select: none;
      }

      button {
        -webkit-app-region: no-drag;
      }

      .glow {
        position: fixed;
        border-radius: 999px;
        filter: blur(60px);
        opacity: 0.6;
        pointer-events: none;
        animation: drift 16s ease-in-out infinite alternate;
      }

      .glow-a {
        width: 70vmax;
        height: 70vmax;
        left: -30vmax;
        top: -35vmax;
        background: radial-gradient(circle, rgba(46, 164, 255, 0.45), transparent 65%);
      }

      .glow-b {
        width: 60vmax;
        height: 60vmax;
        right: -30vmax;
        bottom: -35vmax;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.32), transparent 65%);
        animation-direction: alternate-reverse;
      }

      .grid {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(to right, rgba(148, 163, 184, 0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
        background-size: 32px 32px;
        -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 75%);
        mask-image: radial-gradient(ellipse at center, black 25%, transparent 75%);
      }

      .spark {
        position: fixed;
        bottom: -8px;
        width: 3px;
        height: 3px;
        border-radius: 999px;
        background: var(--accent-2);
        box-shadow: 0 0 8px var(--accent-2);
        opacity: 0;
        pointer-events: none;
        animation: rise linear infinite;
      }

      .window-buttons {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 2;
        display: flex;
        gap: 4px;
      }

      .window-buttons button {
        width: 32px;
        height: 28px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
      }

      .window-buttons button:hover,
      .window-buttons button:focus-visible {
        background: rgba(148, 163, 184, 0.16);
        color: var(--text);
        outline: none;
      }

      .window-buttons .close:hover,
      .window-buttons .close:focus-visible {
        background: #e11d48;
        color: #fff;
      }

      .panel {
        position: relative;
        width: min(400px, calc(100vw - 40px));
        padding: 26px 24px 20px;
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--panel);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(46, 164, 255, 0.08);
      }

      .panel::before {
        content: "";
        position: absolute;
        inset: 0 24px auto;
        height: 1px;
        background: linear-gradient(90deg, transparent, #9fd8ff, var(--accent), var(--violet), transparent);
      }

      .logo-wrap {
        position: relative;
        width: 112px;
        height: 112px;
        margin: 0 auto 12px;
        display: grid;
        place-items: center;
      }

      .halo {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(46, 164, 255, 0.35), transparent 70%);
        animation: pulse 2.4s ease-in-out infinite;
      }

      .logo {
        position: relative;
        width: 92px;
        height: 92px;
        object-fit: contain;
        filter: drop-shadow(0 10px 28px rgba(46, 164, 255, 0.35));
      }

      h1 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        background: linear-gradient(120deg, #cdeaff, var(--accent) 55%, var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .beta {
        display: inline-block;
        margin-top: 6px;
        padding: 2px 8px;
        border: 1px solid rgba(46, 164, 255, 0.35);
        border-radius: 999px;
        color: #9fd8ff;
        font-size: 0.62rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .phase {
        margin: 16px 0 4px;
        font-size: 1rem;
        font-weight: 600;
        color: #f8fafc;
      }

      .detail {
        margin: 0;
        min-height: 2.8em;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.45;
      }

      .dots {
        display: inline-flex;
        gap: 7px;
        margin: 10px 0 8px;
      }

      .dots span {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--accent-2);
        opacity: 0.3;
        animation: dot 1.1s ease-in-out infinite;
      }

      .dots span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      .meter {
        width: 100%;
        height: 6px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.16);
      }

      .meter-fill {
        width: 8%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 12px rgba(0, 242, 255, 0.5);
        transition: width 320ms ease;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 10px;
        color: #8ea2c0;
        font-size: 0.72rem;
      }

      .update,
      .error {
        margin-top: 12px;
        padding: 10px;
        border-radius: 12px;
        font-size: 0.84rem;
        text-align: left;
      }

      .update {
        display: none;
        border: 1px solid rgba(46, 164, 255, 0.35);
        background: rgba(11, 66, 133, 0.28);
      }

      .error {
        display: none;
        border: 1px solid rgba(251, 113, 133, 0.4);
        background: rgba(131, 24, 67, 0.26);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .actions button {
        padding: 8px 12px;
        border: 1px solid transparent;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-primary {
        background: linear-gradient(90deg, #63c0ff, var(--accent));
        color: #04121f;
      }

      .btn-secondary {
        background: rgba(30, 41, 59, 0.9);
        border-color: rgba(148, 163, 184, 0.34);
        color: #e2e8f0;
      }

      .btn-primary:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .actions button:focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 2px;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }

      @keyframes dot {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.3;
        }
        50% {
          transform: translateY(-3px);
          opacity: 1;
        }
      }

      @keyframes drift {
        0% {
          transform: translate3d(0, 0, 0);
        }
        100% {
          transform: translate3d(4vmax, 3vmax, 0);
        }
      }

      @keyframes rise {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        15% {
          opacity: 0.85;
        }
        100% {
          transform: translateY(-105vh);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .spark {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>
    <div class="grid" aria-hidden="true"></div>
    <div id="sparks" aria-hidden="true"></div>

    <div class="window-buttons">
      <button id="splashMinBtn" type="button" aria-label="Minimize" title="Minimize">&#8211;</button>
      <button id="splashCloseBtn" class="close" type="button" aria-label="Close Nexus Forge Gaming" title="Close">&#10005;</button>
    </div>

    <main class="panel" role="main" aria-label="Nexus Forge Gaming is starting" aria-busy="true">
      <div class="logo-wrap">
        <div class="halo" aria-hidden="true"></div>
        <img class="logo" src="./assets/nexusforge-main-logo.png" alt="Nexus Forge Gaming" draggable="false" />
      </div>

      <h1>Nexus Forge Gaming</h1>
      <span class="beta">Open beta</span>
      <p id="phaseText" class="phase" aria-live="polite">Starting Nexus Forge Gaming</p>
      <p id="detailText" class="detail">Getting things ready.</p>

      <div class="dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="meter" aria-hidden="true">
        <div id="meterFill" class="meter-fill"></div>
      </div>

      <div class="meta">
        <span id="modeText">Mode: Detecting</span>
        <span id="versionText">v-</span>
        <span id="meterValue">8%</span>
      </div>

      <section id="updatePanel" class="update" aria-live="polite">
        <div id="updateText">A desktop update is available.</div>
        <div class="actions">
          <button id="updateInstallBtn" class="btn-primary" type="button">Update now</button>
          <button id="updateSkipBtn" class="btn-secondary" type="button">Skip</button>
        </div>
      </section>

      <section id="errorPanel" class="error" role="alert">
        Nexus Forge Gaming could not open. Check your connection, then retry.
        <div class="actions">
          <button id="errorRetryBtn" class="btn-primary" type="button">Retry</button>
        </div>
      </section>
    </main>

    <script>
      const defaultState = {
        stage: "Starting Nexus Forge Gaming",
        detail: "Getting things ready.",
        progress: 8,
      };

      const phaseText = document.getElementById("phaseText");
      const detailText = document.getElementById("detailText");
      const meterFill = document.getElementById("meterFill");
      const meterValue = document.getElementById("meterValue");
      const modeText = document.getElementById("modeText");
      const versionText = document.getElementById("versionText");

      const updatePanel = document.getElementById("updatePanel");
      const updateText = document.getElementById("updateText");
      const updateInstallBtn = document.getElementById("updateInstallBtn");
      const updateSkipBtn = document.getElementById("updateSkipBtn");

      const errorPanel = document.getElementById("errorPanel");
      const errorRetryBtn = document.getElementById("errorRetryBtn");

      let startupFailed = false;
      let startupTimeout = null;

      function clampProgress(value) {
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) {
          return 8;
        }
        return Math.max(0, Math.min(100, Math.round(numeric)));
      }

      function formatVersion(version) {
        const clean = String(version || "").trim().replace(/^v/i, "");
        return clean ? `v${clean}` : "v-";
      }

      function setErrorVisible(visible) {
        errorPanel.style.display = visible ? "block" : "none";
      }

      function getFriendlyStage(stage) {
        const value = String(stage || "").toLowerCase();
        if (value.includes("boot")) return "Starting Nexus Forge Gaming";
        if (value.includes("update") || value.includes("preparing launch")) return "Checking for updates";
        if (value.includes("hosted") || value.includes("connecting")) return "Connecting to Nexus Forge";
        if (value.includes("local") || value.includes("recovery") || value.includes("service")) return "Connecting to services";
        if (value.includes("opening") || value.includes("ready")) return "Preparing your workspace";
        return "Starting Nexus Forge Gaming";
      }

      function getFriendlyDetail(state) {
        const launchMode = String(state?.launchMode || "").toLowerCase();
        if (launchMode === "hosted") {
          return "Please wait while your hosted workspace loads.";
        }
        return "Please wait while your workspace loads.";
      }

      function applyState(payload) {
        const state = { ...defaultState, ...(payload || {}) };
        const progress = clampProgress(state.progress);

        phaseText.textContent = getFriendlyStage(state.stage);
        detailText.textContent = getFriendlyDetail(state);
        meterValue.textContent = `${progress}%`;
        meterFill.style.width = `${Math.max(8, progress)}%`;

        const launchMode = String(state.launchMode || "").toLowerCase();
        if (launchMode === "hosted") {
          modeText.textContent = "Mode: Hosted";
        } else if (launchMode === "local-dev") {
          modeText.textContent = "Mode: Local";
        } else {
          modeText.textContent = "Mode: Detecting";
        }

        versionText.textContent = formatVersion(state.currentVersion || state.latestVersion);
      }

      function showUpdatePanel(updateState) {
        const hasUpdate = Boolean(updateState?.available);
        if (!hasUpdate) {
          updatePanel.style.display = "none";
          return;
        }

        const latest = formatVersion(updateState?.latestVersion);
        const forceRequired = Boolean(updateState?.forceRequired);
        const downloading = Boolean(updateState?.downloading);
        const downloaded = Boolean(updateState?.downloaded);

        if (downloading) {
          const pct = clampProgress(updateState?.downloadPercent || 0);
          updateText.textContent = `Downloading update ${latest} (${pct}%).`;
          updateInstallBtn.disabled = true;
          updateInstallBtn.textContent = "Downloading...";
          updateSkipBtn.style.display = forceRequired ? "none" : "inline-block";
        } else if (downloaded) {
          updateText.textContent = `Update ${latest} is ready to install.`;
          updateInstallBtn.disabled = false;
          updateInstallBtn.textContent = "Install now";
          updateSkipBtn.style.display = forceRequired ? "none" : "inline-block";
        } else {
          updateText.textContent = forceRequired
            ? `Required update ${latest} is available.`
            : `Update ${latest} is available.`;
          updateInstallBtn.disabled = false;
          updateInstallBtn.textContent = forceRequired ? "Install required update" : "Update now";
          updateSkipBtn.style.display = forceRequired ? "none" : "inline-block";
        }

        updatePanel.style.display = "block";
      }

      function wireUpdateActions() {
        updateInstallBtn.addEventListener("click", () => {
          if (!window.nexusforgeDesktop) {
            return;
          }

          const state = window.__lastUpdateState || {};
          const hasDownloaded = state?.available && state?.downloaded && state?.downloadedVersion === state?.latestVersion;

          updateInstallBtn.disabled = true;
          if (hasDownloaded && window.nexusforgeDesktop.restartForUpdate) {
            window.nexusforgeDesktop.resolveUpdatePrompt?.("install");
            window.nexusforgeDesktop.restartForUpdate();
            return;
          }

          updateInstallBtn.textContent = "Downloading...";
          window.nexusforgeDesktop.resolveUpdatePrompt?.("install");
          const downloadPromise = window.nexusforgeDesktop.downloadUpdateNow?.();
          if (downloadPromise && typeof downloadPromise.then === "function") {
            downloadPromise.catch(() => {
              updateInstallBtn.disabled = false;
              updateInstallBtn.textContent = "Update now";
              showUpdatePanel(window.__lastUpdateState || {});
            });
          }
        });

        updateSkipBtn.addEventListener("click", () => {
          updatePanel.style.display = "none";
          window.nexusforgeDesktop?.resolveUpdatePrompt?.("skip");
        });
      }

      function wireRetryAction() {
        errorRetryBtn.addEventListener("click", () => {
          startupFailed = false;
          setErrorVisible(false);
          if (window.nexusforgeDesktop?.retryAppLoad) {
            window.nexusforgeDesktop.retryAppLoad();
          } else {
            window.location.reload();
          }
        });
      }

      function wireWindowButtons() {
        const control = (action) => window.nexusforgeDesktop?.splashControl?.(action);
        document.getElementById("splashMinBtn")?.addEventListener("click", () => control("minimize"));
        document.getElementById("splashCloseBtn")?.addEventListener("click", () => control("close"));
      }

      function addSparks() {
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const host = document.getElementById("sparks");
        for (let index = 0; index < 12; index += 1) {
          const spark = document.createElement("span");
          spark.className = "spark";
          spark.style.left = `${6 + ((index * 37) % 88)}%`;
          spark.style.animationDelay = `${(index * 0.9) % 8}s`;
          spark.style.animationDuration = `${6 + ((index * 3) % 6)}s`;
          host.appendChild(spark);
        }
      }

      function wireStartupBridge() {
        if (window.nexusforgeDesktop?.onStartupState) {
          window.nexusforgeDesktop.onStartupState((state) => {
            if (startupFailed) {
              return;
            }
            clearTimeout(startupTimeout);
            applyState(state);
          });
          return;
        }

        // Opened outside the desktop app (no bridge): no progress is invented; it just says it is starting.
        applyState(defaultState);
      }

      function wireUpdateBridge() {
        if (window.nexusforgeDesktop?.getUpdateState) {
          window.nexusforgeDesktop
            .getUpdateState()
            .then((state) => {
              window.__lastUpdateState = state;
              versionText.textContent = formatVersion(state?.currentVersion || state?.latestVersion);
              showUpdatePanel(state);
            })
            .catch(() => {});
        }

        if (window.nexusforgeDesktop?.onUpdateState) {
          window.nexusforgeDesktop.onUpdateState((state) => {
            window.__lastUpdateState = state;
            versionText.textContent = formatVersion(state?.currentVersion || state?.latestVersion);
            showUpdatePanel(state);
          });
        }
      }

      applyState(defaultState);
      wireUpdateActions();
      wireRetryAction();
      wireWindowButtons();
      addSparks();
      wireStartupBridge();
      wireUpdateBridge();

      startupTimeout = setTimeout(() => {
        startupFailed = true;
        setErrorVisible(true);
      }, 60000);
    </script>
  </body>
</html>
