name: CI

# Typecheck, test and build the server and the website, and run the website and desktop unit tests,
# on every push and pull request. Uses a throwaway Postgres; no repository secrets are used.
on:
  push:
    branches: ["**"]
  pull_request:

# Read-only token for every job: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No job needs the Electron binary (the desktop tests use only Node).
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  server:
    name: Server (typecheck, tests, build)
    # Pinned image: ubuntu-latest moves to a new image on its own schedule.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vexora
          POSTGRES_PASSWORD: vexora
          POSTGRES_DB: vexora_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vexora:vexora@localhost:5432/vexora_ci
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters-long
      DISCORD_BOT_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The throwaway database is built from the migration files (the same way production is changed), so a
      # migration that doesn't apply cleanly fails CI before it reaches the live database.
      - name: Prisma client and migrations
        working-directory: apps/server
        run: npx prisma generate && npx prisma migrate deploy
      - name: Typecheck
        working-directory: apps/server
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npm test -w @nexusforge/server
      - name: Ops script tests (backup encryption, logon checks)
        run: node --test "scripts/lib/*.test.mjs"
      - name: Build
        run: npm run build -w @nexusforge/server

  web:
    name: Web (typecheck, lint, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4001
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npm run lint -w web
      - name: Unit tests
        run: npm test -w web
      - name: Build
        run: npm run build -w web

  desktop:
    name: Desktop (unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test -w @nexusforge/desktop
