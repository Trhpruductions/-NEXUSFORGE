name: Release PR Guard

# Checks a pull request that changes the desktop release manifest or the release scripts:
# the manifest must pass the schema check (blocking), and the Discord secrets the post-merge job needs
# are looked up (warning only). The real release gate is the "release-approval" environment on the
# post-merge Discord job; see docs/RELEASE-APPROVAL.md.
on:
  pull_request:
    branches: ["main", "master"]
    paths:
      - apps/web/public/desktop-update.json
      - scripts/desktop-release-share.ps1
      - apps/server/scripts/discord-post-download-embed.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-desktop-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The validator uses only Node built-ins, so nothing is installed for it.
      - name: Validate desktop-update.json schema
        working-directory: apps/server
        run: node ./scripts/validate-desktop-manifest.mjs

  discord-sync-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: validate-desktop-manifest

    steps:
      # Only "set / not set" is checked; no secret value reaches this pull request job. Secrets kept as
      # environment secrets on "release-approval" (recommended) are not visible here, so a miss is a warning.
      - name: Check Discord sync secrets
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN != '' }}
          HAS_TARGET: ${{ secrets.DISCORD_DOWNLOAD_TARGET_ID != '' || secrets.DISCORD_REPORT_GUILD_ID != '' || secrets.DISCORD_GUILD_ID != '' }}
        run: |
          if [ "${HAS_TOKEN}" = "true" ] && [ "${HAS_TARGET}" = "true" ]; then
            echo "Discord sync secrets preflight passed (repository secrets)."
            exit 0
          fi
          echo "::warning::Discord download-link sync secrets are not set as repository secrets. After merge the Discord job will fail unless DISCORD_BOT_TOKEN and one of DISCORD_DOWNLOAD_TARGET_ID / DISCORD_REPORT_GUILD_ID / DISCORD_GUILD_ID exist as secrets of the release-approval environment."
